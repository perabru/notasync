name: Testes unitários

on:
  push:
    branches: [main]
    paths:
      - 'notasync/**'
      - 'tests/**'
      - 'installer/**'
      - 'requirements*.txt'
      - 'requirements-windows.lock'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'notasync/**'
      - 'tests/**'
      - 'installer/**'
      - 'requirements*.txt'
      - 'requirements-windows.lock'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOTASYNC_BROWSER_TESTS: '0'
      NOTASYNC_TRAINING_BROWSER_TESTS: '0'
    steps:
      - name: Obter fontes
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Executar testes locais
        run: python -m unittest discover -s tests -v
